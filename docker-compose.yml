services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/api --reload-dir /app/config --reload-dir /app/core --reload-dir /app/db --reload-dir /app/providers --reload-dir /app/storage --reload-dir /app/workers
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      CONFIG_FILE: config/default.yaml
      # Prefer the compose-network Jaeger over whatever .env sets; OTLP
      # export is async, so Jaeger being briefly down never takes the API down.
      OTEL_EXPORTER_ENDPOINT: http://jaeger:4317
    volumes:
      - .:/app
      - dubbing-data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A workers.celery_app worker --loglevel=info
    env_file: .env
    environment:
      CONFIG_FILE: config/default.yaml
    volumes:
      - .:/app
      - dubbing-data:/data/storage
      - hf-cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A workers.celery_app beat --loglevel=info
    env_file: .env
    environment:
      CONFIG_FILE: config/default.yaml
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-shot: apply DB migrations before the API/worker start.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: alembic upgrade head
    env_file: .env
    environment:
      CONFIG_FILE: config/default.yaml
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dubbing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Trace backend: OTLP gRPC collector + query UI. The API exports to it via
  # the service name (see api.environment.OTEL_EXPORTER_ENDPOINT).
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  postgres-data:
  minio-data:
  dubbing-data:
  hf-cache: